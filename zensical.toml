[project]
site_url = "https://mathod95.github.io/skills/"
site_name = "Claude Skills & Notes"
site_description = "Skills, références techniques et process de gestion des skills Claude Code de Mathod"
site_author = "Mathod"

copyright = "Copyright &copy; 2026 Mathod"

repo_url = "https://github.com/Mathod95/skills"
repo_name = "Mathod95/skills"
edit_uri = "edit/main/docs/"

nav = [
  { "Accueil" = "index.md" },
  { "research/learn-a-tech" = [
      { "Le skill" = "skills/research/learn-a-tech/SKILL.md" },
      { "Candidats de futurs skills" = "skills/research/learn-a-tech/candidate-skills.md" },
      { "Référence Crossplane" = "skills/research/learn-a-tech/references/crossplane.md" },
      { "Référence Backstage" = "skills/research/learn-a-tech/references/backstage.md" },
      { "Référence Saltbox" = "skills/research/learn-a-tech/references/saltbox.md" },
      { "Studycase : .m. Crossplane" = "skills/research/learn-a-tech/studycases/crossplane-m-suffix.md" },
    ] },
  { "saltbox/create-custom-role" = [
      { "Le skill" = "skills/saltbox/create-custom-role/SKILL.md" },
    ] },
]

extra_css = ["stylesheets/toggle-sidebar.css"]
extra_javascript = ["javascripts/toggle-sidebar.js"]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "fr"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
